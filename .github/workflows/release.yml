name: Release

# Runs only for a version tag, never for a plain commit:
#   1. the tag must be annotated, point at a commit on main, carry release
#      notes in its message (.claude/rules/release-tag.md), and match the
#      version in Cargo.toml and CHANGELOG.md;
#   2. on six platforms: the gate, `mise run gate` (mise.toml), then the
#      plugin's static release binary built by Cargo; and, once,
#      the runtime and the generated code built and tested with the
#      minimum Rust version (`rust-version` in Cargo.toml);
#   3. when all of these pass, the GitHub Release for the tag: the six binaries
#      and checksums-sha256.txt (as buffa publishes it; bazel_utils'
#      registry.bzl takes each platform's sha256 from it), titled with the tag message's subject, the
#      message's body as notes.
# A manual run (workflow_dispatch) is the dry run before tagging: steps 2
# and 3 without the publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # mise.lock is lockfile format 4, which mise reads from 2026.11.11.
  MISE_VERSION: 2026.11.12
  PLUGIN: protoc-gen-protocontract-buffa

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag is annotated, on main, and matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The checkout may hold the tag as a lightweight ref: fetch the
          # tag object itself, and main to compare with.
          git fetch --force origin "+refs/tags/${tag}:refs/tags/${tag}" \
            "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git cat-file -t "refs/tags/${tag}")" != tag ]]; then
            echo "${tag} is not an annotated tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$(git rev-parse "${tag}^{commit}")" origin/main; then
            echo "${tag} does not point at a commit on main" >&2
            exit 1
          fi
          body="$(git tag -l --format='%(contents:body)' "${tag}")"
          if [[ -z "${body//[[:space:]]/}" ]]; then
            echo "the message of ${tag} has no body: it is the release notes" >&2
            exit 1
          fi
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "tag ${GITHUB_REF_NAME}, Cargo.toml ${cargo_version}"
          test "${GITHUB_REF_NAME}" = "v${cargo_version}"
          grep -q "^## \[${cargo_version}\]" CHANGELOG.md

  platform:
    name: ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-26.04
            mise: linux-x64
            mise_sha256: 9c12c24f5eac6b6357e5265e2629166cc3005459037f5d747680a99e375ff2ab
            target: x86_64-unknown-linux-musl
            file: linux-x86_64
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
            mise: linux-arm64
            mise_sha256: 52f4a75495bde5571d5d0a45b4d9b5227c2c099b92f9be85328569e67b12c553
            target: aarch64-unknown-linux-musl
            file: linux-aarch64
          - platform: macos-amd64
            runner: macos-26-intel
            mise: macos-x64
            mise_sha256: 14954fb2f451636a53a04c025e1bf896f5f47f3fd19aaac9f6ff792fdfdbc18d
            target: x86_64-apple-darwin
            file: darwin-x86_64
          - platform: macos-arm64
            runner: macos-26
            mise: macos-arm64
            mise_sha256: 87b2bd5a1b88a612ee8856df23499404b115870b5a8a8e008763c7cd51c8d412
            target: aarch64-apple-darwin
            file: darwin-aarch64
          - platform: windows-amd64
            runner: windows-2025
            mise: windows-x64.zip
            mise_sha256: 706fecc47fba7e4da63f59dccd3262502c59e4699035548f1113df95fcfca96e
            target: x86_64-pc-windows-msvc
            file: windows-x86_64.exe
            exe: .exe
          - platform: windows-arm64
            runner: windows-11-arm
            mise: windows-arm64.zip
            mise_sha256: bee83ff472860af33d1cf81a64e6effe34f219d76c7a924df332c8762a938db9
            target: aarch64-pc-windows-msvc
            file: windows-aarch64.exe
            exe: .exe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null; then
            if [[ "${RUNNER_OS}" == "Windows" ]]; then
              arch="$([[ "${{ matrix.platform }}" == windows-arm64 ]] && echo aarch64 || echo x86_64)"
              curl -fsSL -o "${RUNNER_TEMP}/rustup-init.exe" \
                "https://static.rust-lang.org/rustup/dist/${arch}-pc-windows-msvc/rustup-init.exe"
              "${RUNNER_TEMP}/rustup-init.exe" -y --profile minimal --default-toolchain none
              cygpath -w "${USERPROFILE}/.cargo/bin" >> "${GITHUB_PATH}"
            else
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
              echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
            fi
          fi

      # rust-toolchain.toml selects the toolchain and its components
      # (clippy, rustfmt) for the gate.
      - name: Install the toolchain
        run: rustup toolchain install

      - name: Install mise
        run: |
          set -euo pipefail
          asset="mise-v${MISE_VERSION}-${{ matrix.mise }}"
          dir="${RUNNER_TEMP}/mise"
          mkdir -p "${dir}"
          curl -fsSL -o "${dir}/${asset}" \
            "https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/${asset}"
          # By OS, not by what is on PATH: macOS ships a BSD `sha256sum`
          # that does not read a checksum list from stdin.
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            echo "${{ matrix.mise_sha256 }}  ${dir}/${asset}" | shasum -a 256 -c
          else
            echo "${{ matrix.mise_sha256 }}  ${dir}/${asset}" | sha256sum -c
          fi
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            pwsh -NoProfile -Command "Expand-Archive -Path '$(cygpath -w "${dir}/${asset}")' -DestinationPath '$(cygpath -w "${dir}")'"
            bin="$(dirname "$(find "${dir}" -name mise.exe | head -n 1)")"
            cygpath -w "${bin}" >> "${GITHUB_PATH}"
          else
            mv "${dir}/${asset}" "${dir}/mise"
            chmod +x "${dir}/mise"
            echo "${dir}" >> "${GITHUB_PATH}"
          fi

      # Every tool at its version in mise.toml, checked against mise.lock.
      # The token lifts GitHub's rate limit on the release downloads.
      - name: Install the tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mise --version
          mise trust
          mise install --locked

      # The task scripts run in bash: here, the bash of Git for Windows,
      # first on PATH in a bash step.
      - name: Gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run gate

      # rust-toolchain.toml selects the toolchain; the target and, on
      # Windows, llvm-tools (for the static check) are added to it.
      - name: Build the release binary
        run: |
          set -euo pipefail
          # RUSTFLAGS would replace the static flags of .cargo/config.toml.
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            rustup component add llvm-tools
          fi
          cargo build --locked --profile dist --target "${{ matrix.target }}" -p "${PLUGIN}"

      - name: Check the binary is static and answers protoc
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/dist/${PLUGIN}${{ matrix.exe }}"
          case "${RUNNER_OS}" in
            Linux)
              file "${binary}"
              file "${binary}" | grep -Eq "statically linked|static-pie linked"
              ;;
            macOS)
              # Only system libraries: Apple supports no fully static binary.
              otool -L "${binary}"
              if otool -L "${binary}" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)'; then
                echo "links a library outside the system" >&2
                exit 1
              fi
              ;;
            Windows)
              host="$(rustc -vV | sed -n 's/^host: //p')"
              objdump="$(rustc --print sysroot)/lib/rustlib/${host}/bin/llvm-objdump.exe"
              "${objdump}" -p "${binary}" | grep "DLL Name"
              if "${objdump}" -p "${binary}" | grep -iE "DLL Name: (vcruntime|msvcp|ucrtbase|api-ms-win-crt)"; then
                echo "links the C runtime dynamically" >&2
                exit 1
              fi
              ;;
          esac
          # An empty CodeGeneratorRequest: the plugin must answer and exit 0.
          "${binary}" < /dev/null > "${RUNNER_TEMP}/response.bin"
          test -s "${RUNNER_TEMP}/response.bin"

      - name: Name the binary for the release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            version="dev"
          fi
          mkdir -p dist
          cp "target/${{ matrix.target }}/dist/${PLUGIN}${{ matrix.exe }}" \
            "dist/${PLUGIN}-${version}-${{ matrix.file }}"

      # The binary itself, not a zip: the artifact takes the file's name.
      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*
          archive: false
          if-no-files-found: error

  # What a consumer compiles (the runtime and the generated code) must
  # build with the workspace's rust-version, older than the pinned
  # toolchain. Cargo only, on one platform: the code is the same on all.
  msrv:
    name: Minimum Rust version
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      # The version comes from Cargo.toml, so the check cannot drift from
      # the declared floor. `+<version>` overrides rust-toolchain.toml.
      - name: Build and test with the minimum Rust version
        run: |
          set -euo pipefail
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "${msrv}"
          echo "rust-version ${msrv}"
          rustup toolchain install "${msrv}" --profile minimal
          cargo "+${msrv}" check --locked -p protocontract --no-default-features
          cargo "+${msrv}" test --locked -p protocontract --all-features
          cargo "+${msrv}" test --locked -p contract-golden \
            -p glossary-api -p glossary-consumer -p glossary-provider -p glossary-app

  # Runs in the dry run too, up to the publish step, so the hand-over of
  # the binaries and their checksums is tested before a tag.
  release:
    name: Release
    needs: [platform, msrv]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.PLUGIN }}-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          # One checksum file for all six, in `sha256sum` format.
          (
            cd dist
            binaries=("${PLUGIN}"-*)
            test "${#binaries[@]}" -eq 6
            sha256sum -- "${binaries[@]}" > checksums-sha256.txt
            sha256sum -c checksums-sha256.txt
            cat checksums-sha256.txt
          )
          test "$(find dist -type f | wc -l)" -eq 7

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          git fetch --force origin "+refs/tags/${tag}:refs/tags/${tag}"
          # The tag message: its subject is the title, its body the notes.
          title="$(git tag -l --format='%(contents:subject)' "${tag}")"
          git tag -l --format='%(contents:body)' "${tag}" > "${RUNNER_TEMP}/notes.md"
          test -n "${title}"
          test -s "${RUNNER_TEMP}/notes.md"
          gh release create "${tag}" dist/* \
            --title "${title}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag
