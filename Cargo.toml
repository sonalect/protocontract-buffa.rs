[workspace]
resolver = "3"
members = [
    "examples/glossary/api",
    "examples/glossary/app",
    "examples/glossary/consumer",
    "examples/glossary/provider",
    "examples/refs/api",
    "rust/protocontract",
    "rust/golden",
    "rust/protoc-gen-protocontract-buffa",
]

[workspace.package]
edition = "2024"
# The floor for code a consumer compiles: `protocontract`, the generated
# code (golden, glossary). 1.92 is the oldest rustc that compiles the
# generated bidi-streaming handles; the release workflow checks it. The
# plugin, a binary we build, sets its own (rust/protoc-gen-protocontract-buffa).
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/sonalect/protocontract-buffa.rs"
version = "0.4.2"

[workspace.dependencies]
# Caret ranges, not `=` pins: `protocontract` and the plugin are published,
# and an exact pin in a library conflicts with a consumer on any other
# version. Cargo.lock holds the exact versions we build and test, and moves
# only under the quarantine (.claude/rules/dependency-quarantine.md).
glossary-api = { path = "examples/glossary/api" }
glossary-consumer = { path = "examples/glossary/consumer" }
glossary-provider = { path = "examples/glossary/provider" }
protocontract = { path = "rust/protocontract" }
buffa = "0.9.2"
buffa-codegen = "0.9.2"
buffa-types = "0.9.2"
connectrpc = { version = "0.9.1", default-features = false }
futures-core = "0.3.34"
heck = "0.5.0"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full"] }
tokio = { version = "1.53.3", default-features = false }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

# Release binaries of the plugin:
#   cargo build --locked --profile dist --target <triple> -p protoc-gen-protocontract-buffa
# The binaries are static per target (.cargo/config.toml): Linux on the
# musl targets, Windows with a static C runtime; macOS links only the
# system libraries (Apple supports no fully static binary). Build with
# RUSTFLAGS unset: it replaces the flags of .cargo/config.toml.
[profile.dist]
inherits = "release"
lto = "fat"
