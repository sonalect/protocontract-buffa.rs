[package]
name = "refs-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Example: a message that stands for a reference to a service."

[features]
default = ["tokio"]
tokio = ["protocontract/tokio"]

[dependencies]
protocontract = { workspace = true }
buffa = { workspace = true, features = ["json"] }
buffa-types = { workspace = true }
protovalidate-buffa = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
